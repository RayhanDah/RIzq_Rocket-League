#:schema https://rlbot.org/schemas/agent.json
# Configuration RLBot v5 — format vérifié le 12/10/2026 avec https://wiki.rlbot.org/v5/botmaking/config-files/
[settings]
agent_id = "ensisa/rlagent/v0.1"
name = "RLAgent"
# run_command est lancé depuis ce dossier (bot/). Venv dédié au bot : rlgym-rlbot + torch + rlagent
# (voir INSTALL.md §8) ; il est séparé du venv d'entraînement car rlgym-rlbot impose ses propres versions.
run_command = "..\\.venv-bot\\Scripts\\python.exe bot.py"
run_command_linux = "../.venv-bot/bin/python bot.py"
hivemind = false

[details]
description = "Agent RL (PPO/SPO, acteur à attention) entraîné avec RLGym v2 + RocketSim. Hors ligne uniquement."
developer = "Équipe projet RL — ENSISA"
language = "rlgym"
tags = ["1v1", "teamplay"]
