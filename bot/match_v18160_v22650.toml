#:schema https://rlbot.org/schemas/match.json
# Match RLBot v5 hors ligne : v18160 (bleu) contre v22650 (orange).
# Lancement : .venv-bot\Scripts\python scripts\run_match.py --config bot/match_v18160_v22650.toml
[rlbot]
launcher = "Epic"
auto_start_agents = true
wait_for_agents = true

[match]
game_mode = "Soccar"
game_map_upk = "Stadium_P"
skip_replays = true
enable_rendering = false
enable_state_setting = false

[mutators]
match_length = "FiveMinutes"

[[cars]]
type = "rlbot"
team = 0
config_file = "agent_v18160.toml"

[[cars]]
type = "rlbot"
team = 1
config_file = "agent_v22650.toml"
