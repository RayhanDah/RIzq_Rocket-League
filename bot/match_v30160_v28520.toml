#:schema https://rlbot.org/schemas/match.json
# Match RLBot v5 hors ligne : v30160 (bleu) contre v28520 (orange). Série du 24/11/2026.
[rlbot]
launcher = "Epic"
auto_start_agents = true
wait_for_agents = true

[match]
game_mode = "Soccar"
game_map_upk = "Stadium_P"
skip_replays = true
enable_rendering = false
enable_state_setting = false

[mutators]
match_length = "FiveMinutes"

[[cars]]
type = "rlbot"
team = 0
config_file = "agent_v30160.toml"

[[cars]]
type = "rlbot"
team = 1
config_file = "agent_v28520.toml"
