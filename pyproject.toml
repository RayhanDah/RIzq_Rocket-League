[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlagent"
version = "0.1.0"
description = "Agent Rocket League (RLGym v2 + RocketSim) — PPO/SPO, acteur à attention, 1v1/2v2/3v3"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pyyaml>=6",
    "rlgym[rl-sim]==2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]
viz = ["rlgym[rl-rlviser]==2.0.1"]
wandb = ["wandb>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
