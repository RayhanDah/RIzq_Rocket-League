# Petit PC portable : valider le pipeline et lancer les premiers runs.
ppo:
  batch_steps: 50_000
  minibatch_size: 25_000
  device_chunk: 4_096
train:
  # Core Ultra 5 125H (14 cœurs), benchmarks du 12/10/2026 (runs de 400k steps, scripts/benchmark_sps.py) :
  # - collecte seule : 9 workers x 1 arène → ~3 400 sps ; 4 workers x 8 arènes → ~6 700 sps ;
  # - de bout en bout : 4x8, synchrone, 8 threads → ~1 400 sps (collecte ~11 s + update ~25 s pour 50k steps),
  #   autant que l'asynchrone et plus simple. L'update sur CPU reste le goulot (cf. GPU / Kaggle).
  n_workers: 4
  envs_per_worker: 8
  async_collect: false          # true = collecte du lot suivant pendant l'update (1 itération de retard, ratio exact)
  torch_threads: 8
  checkpoint_every_steps: 2_000_000
selfplay:
  pool_every_steps: 5_000_000
