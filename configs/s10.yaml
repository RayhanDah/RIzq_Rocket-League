# Run « s10 » (23/10/2026) : NOUVEL AGENT, DE ZÉRO (refonte, cf. REFONTE_S10.md).
# On abandonne nos variantes maison (SPO + lr piloté par le KL, acteur à attention, 3 formats, 6 exercices, ~20 termes
# de rewards, démarrages à chaud en chaîne) pour la recette de référence des bots 1v1 RLGym (rlgym-ppo / GigaLearn),
# et on n'ajoute une difficulté que lorsque la précédente est maîtrisée (curriculum par paliers, curriculum.py).
# Profil autonome : à utiliser SEUL avec un profil d'infra (pas de laptop_s2 … laptop_s6) :
#   Portable : .venv-xpu\Scripts\python -m rlagent.train --profile laptop --profile laptop_xpu --profile s10 --run-name s10_ppo_laptop
#   Kaggle   : .venv\Scripts\python cloud/kaggle_sync.py launch --run-name s10_ppo_kaggle --profiles s10 --anchors-from s10
# Infos clés à suivre : ladder/elo (échelle Elo absolue, 0 = réseau aléatoire), ladder/anchor/s6_spo_kaggle,
# curriculum/stage, mech/flips_per_min, touches_per_min.
train:
  init_from: null                  # de zéro
  total_steps: 100_000_000_000     # default.yaml : 10 G, atteint en plein milieu de la session 4 (8,14 G au départ)
  # Session 10 (22/11, décision PO) : imitation de Nexto au départ (kickstarting). Les workers donnent l'action que Nexto
  # choisirait (argmax de sa politique, même table de 90 actions que nous) pour 25 % des voitures et des steps ; le
  # learner ajoute coef × entropie croisée vers cette action, coef de 0,5 à la reprise (27,45 G) jusqu'à 0 en 1,5 G steps.
  # Coût mesuré : 0,6 ms par étiquette (CPU, 1 thread), ~10-15 % de débit pendant la phase d'imitation.
  # Session 11 (23/11, décision PO) : coupée. En session 10, l'Elo a chuté de ~350 en 13 M steps (écart −353 contre
  # v25785) pendant que l'accord avec Nexto montait (27 → 35 %) : l'entropie croisée (0,5 × ~2,5) écrasait la perte PPO.
  kickstart: {enabled: false, begin: 27_450_134_560, steps: 1_500_000_000, coef: 0.5, frac: 0.25}
  # Session 5 (08/11) : la session 4 a dérivé à partir de 8,7 G (jonglage payé par aerial_touch). On repart de v8400,
  # la meilleure version mesurée ; les versions plus récentes quittent le pool (pool/rejected/). Une seule fois par run
  # et par version (guard.json, manual_rollbacks).
  # Session 7 (14/11, décision PO) : retour à v13600. En simulation contre Necto (100 matchs, audits_2026-11-14/) :
  # v13535 24-15-61, v13600 58-9-33, v13665 6-5-89, v13720 1-1-98. À partir de 13,6 G (lucidité à plein poids),
  # l'agent ne dispute plus les kickoffs (0-7 % de premier contact, Necto marque sur 26 % d'entre eux) ; contre
  # v13535, v13600 vaut presque v13720 (150-17-33 contre 156-15-29).
  # Session 8 (17/11) : on continue depuis la fin de la session 7 (18,54 G), sans retour en arrière. v18160 (meilleure au
  # classement) bat v18540 112-60, mais v18540 fait mieux contre Necto (86-7-7 contre 79-15-6) : écart trop faible pour
  # jeter 380 M steps et le critique qui va avec. v13600 reste dans guard.json (manual_rollbacks) : il ne rejouerait pas.
  # Session 9 (20/11) : on continue depuis la fin de la session 8 (23,04 G = v23037, le bot actuel), sans retour.
  rollback_to: null
  rollback_critic_warmup_iters: 50
  # Jalons complets (acteur + critique + optimiseur) hors rotation, pour que le garde-fou ait où revenir.
  milestone_every_steps: 250_000_000
  keep_milestones: 8
  # Garde-fou (guard.py) : dérive maintenue 60 itérations (~24 M steps) → retour au meilleur jalon, terme fautif coupé.
  # Session 4 rejouée : ladder/drop passe 120 vers 8,85 G, retour au jalon de 8,5 G au lieu de 2 G steps perdus.
  # 14/11 (paliers 8-10) :
  # - plafond de part de 5 % pour les termes renforcés ou remis (la dérive de la session 5 n'a jamais dépassé ~6 %,
  #   invisible au seuil de 25 %) ; 8 % pour la démo (~2 démos / min à 8 : au-delà, l'agent chasse au lieu de jouer) ;
  # - retour si les buts / min tombent sous 60 % du meilleur des 4 derniers jalons (session 5 : 2,4 → 0,5) ;
  # - terme fautif ramené à son ancien poids plutôt qu'à 0 ; aerial_touch remis en jeu une seule fois par run ;
  # - 3 retours par session : un par palier nouveau.
  guard: {enabled: true, max_drop: 120.0, max_share: 0.25, min_entropy: 1.5, patience: 60, warmup_iters: 100,
          max_rollbacks: 3, min_goals_ratio: 0.6,
          # 17/11 (paliers 11-14) : save et bump plafonnés à 5 % comme les autres termes renforcés, small_pad à 3 % ;
          # s'ils dérivent, retour au poids de la session 7 (aerial_touch 1, bump 1,3, save 0, small_pad 0).
          # 20/11 (paliers 15-17) : kickoff_stall, demo_goal et high_goal plafonnés à 3 % (estimé : ~1,7 % pour
          # kickoff_stall quand 92 % des kickoffs sont bloqués, ~0,1-0,2 % pour les deux bonus de but) ; s'ils dérivent,
          # retour au poids de la session 8 (0).
          term_max_share: {kickoff_win: 0.05, kickoff_rush: 0.05, demo: 0.08, aerial_touch: 0.05, save: 0.05, bump: 0.05,
                           small_pad: 0.03, kickoff_stall: 0.03, demo_goal: 0.03, high_goal: 0.03, bump_goal: 0.03,
                           wall_touch: 0.03, fast_aerial: 0.03, kickoff_first: 0.03, big_pad_low: 0.03,
                           slow_turn: 0.03, powerslide: 0.03},
          fallback_weights: {kickoff_win: 3.0, kickoff_rush: 0.05, demo: 5.3, aerial_touch: 1.0, bump: 1.3,
                             kickoff_stall: 0.0, demo_goal: 4.0, high_goal: 0.0, bump_goal: 0.0, wall_touch: 0.0,
                             fast_aerial: 0.0, kickoff_first: 0.0, big_pad_low: 0.0, slow_turn: 0.0,
                             powerslide: 0.0},
          reenable_terms: [aerial_touch]}
env:
  # 1v1 uniquement : le match se joue en 1v1 (README) ; 2v2/3v3 plus tard. Les profils FUSIONNENT les dictionnaires :
  # 2 et 3 doivent être mis à 0 explicitement (sinon ceux de default.yaml restent).
  format_weights: {1: 1.0, 2: 0.0, 3: 0.0}
  # Exercices = états de départ, le reste de l'épisode est un match normal ; leur niveau suit la réussite.
  # Palier 6 : Necto ne démarrait que 8 % de ses épisodes par un kickoff (70 % depuis des replays, surtout aériens). Faute
  # de replays, on varie les situations. `drill_air` : le vol à partir de la fin du geste (l'exercice `aerial` plafonne à
  # 3,7 %). `drill_reset` : roues face à la balle, pour que le reward `flip_reset` puisse se déclencher.
  # 08/11 : `drill_aerial` retiré (0 % de réussite sur toute la session 4, 3,7 % sur la 3), ses 5 % vont au jeu libre.
  # 17/11 (session 8, PO : il ne défend pas les tirs aériens de Necto) : drill_aerial_defense 5 → 10 %, pris au jeu libre.
  start_weights: {kickoff: 0.3, random: 0.10, aerial: 0.05, attack_defense: 0.05, drill_air: 0.15, drill_reset: 0.05,
                  drill_aerial: 0.0, drill_shot: 0.05, drill_wall: 0.10, drill_low_boost: 0.05, drill_aerial_defense: 0.10}
  # 22/11 (session 10, PO : plus à l'aise au mur) : drill_wall 5 → 10 %, pris au jeu libre (random 0,15 → 0,10).
  # Plancher 0,4 de l'aérien : balles à 580-890 uu, au-dessus du seuil des rewards aériens et hors de portée d'un simple
  # saut. Vol et reset partent de 0 (leur niveau mesure justement le recul par rapport au geste).
  drill_curriculum: {enabled: true, start: 0.4, min_level: 0.4, step: 0.005, promote: 0.6, demote: 0.3,
                     per_kind: {air: {start: 0.0, min_level: 0.0}, reset: {start: 0.0, min_level: 0.0},
                                aerial_defense: {start: 0.2, min_level: 0.0}}}
  no_touch_timeout_s: 10
  episode_timeout_s: 300
  ball_prediction: true            # observation de s6 (sans course ni pads) : s6 peut servir d'ancre
  race_features: false
  boost_features: false
  adaptive_drills: false
model:
  type: mlp                        # models/mlp.py : Linear + ReLU, sans LayerNorm
  actor_hidden: [512, 512, 512]
  critic_hidden: [1024, 1024, 512]
ppo:
  policy_loss: ppo                 # PPO clippé : la référence (SPO reste disponible pour l'ablation du projet)
  clip_eps: 0.2
  lr_schedule: fixed               # lr fixe (guide rlgym-ppo), réduit par le curriculum au dernier palier
  lr_actor: 2.0e-4
  lr_critic: 2.0e-4
  batch_steps: 100_000
  minibatch_size: 50_000
  epochs: 2
  gamma: 0.995                     # 10 s de demi-vie, comme Necto : ramasser du boost paie plus de 5 s plus tard
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 1.0
  max_grad_norm: 0.5
  norm_control: null
  # lot plus gros quand le jeu se complique : gradient moins bruité (mesure du 22/10 : signal ~4 % à 50 k)
  batch_schedule:
    - [0, 100_000, 50_000]
    - [50_000_000, 200_000, 100_000]
    - [150_000_000, 400_000, 100_000]
rewards:
  # Recette GigaLearn (exemple officiel), mise à l'échelle but = 10 (÷ 15) : rapides vers la balle, frappes fortes,
  # sauter n'est pas puni (in_air), boost ramassé et gardé, but / balle → but / démos en zéro-somme.
  zero_sum: 1.0
  # aerial_touch (14/11, palier 10) : zéro-somme, ce qu'un camp gagne en l'air l'autre le perd. Les deux dérives de la
  # session 5 étaient payées aux deux camps à la fois (~10 / min chacun) ; ici une boucle à deux ne rapporte rien.
  # demo_goal, high_goal (20/11) : bonus de but, zéro-somme comme le but. kickoff_stall n'y est PAS : attendre coûte
  # aux deux camps (en zéro-somme, les deux pénalités s'annuleraient).
  zero_sum_terms: [goal, vel_ball_to_goal, demo, bump, aerial_touch, save, demo_goal, high_goal, bump_goal, wall_touch,
                   fast_aerial, kickoff_first]
  team_spirit: {start: 0.0, end: 0.0, steps: 1}
  anneal: null                     # aucune décroissance programmée en steps : c'est le curriculum qui décide
  vel_player_to_ball_signed: true
  touch_aerial_bonus: 0.0
  flip_speed_min_speed: 300.0
  aerial_min_z: 500.0              # aerial_touch : balle au-dessus de 500 uu (220 avant : une touche en sautant suffisait)
  aerial_min_air_boost_s: 0.25     # et boost en l'air depuis le décollage (86 % des touches payées : sauts depuis un mur)
  air_approach_boost_only: true    # air_approach paie le vol boosté, plus les sauts et flips vers une balle haute
  # 08/11, après la session 4 (jonglage payé ~30 / s contre 10 pour un but, Elo 916 → 270 à partir de 8,7 G) : chaque
  # compétence aérienne est payée une fois par vol, selon ce qu'elle apporte. Bornes vérifiées par tests/test_exploits.py.
  aerial_useful_speed: 1000.0      # aerial_touch : plein si la touche ajoute 1 000 uu/s vers le but adverse
  aerial_first_floor: 0.25         # 1re touche du vol : un quart payé quelle que soit la direction
  aerial_follow: 0.5               # touches suivantes du même vol : × 0,5 à chaque rang, et seulement vers le but
  save_opp_only: true              # 17/11 : un arrêt n'est payé que sur une balle envoyée par l'adversaire
  air_approach_until_touch: true   # air_approach : plus rien après la 1re touche du vol
  air_approach_signed: true        # et s'éloigner coûte : l'aller-retour sous la balle ne rapporte rien
  flip_reset_require_spent: true   # flip reset payé seulement si le saut avait été utilisé (pas en rebondissant)
  flip_reset_max_per_flight: 3     # 1 + 0,5 + 0,25 : un triple reset est payé, pas un quatrième
  shot_off_target_factor: 0.25     # shot : frappe hors cadre dans le camp adverse payée au quart
  shot_threat_floor: 0.5           # shot_threat : moitié de la valeur dès que la balle est cadrée, le reste à l'approche
  # 20/11 (PO) kickoff_stall : 0 jusqu'au temps d'un kickoff foncé + 0,1 s (2,17 / 2,43 / 2,70 s selon la distance),
  # puis jusqu'à −1 en 1 s (× poids 2 = −2) ; −0,125 (× 2 = −0,25) en plus pour la voiture qui perd la course.
  kickoff_stall_margin_s: 0.1
  kickoff_stall_ramp_s: 1.0
  kickoff_stall_loser: 0.125
  # PO (20/11) demo_goal : plein si le but arrive dans les 0,75 s après la démo, puis décroissance linéaire.
  # PO (22/11) : jusqu'à 0 à 5 s au lieu de 3 s (aussi pour bump_goal, palier 18).
  demo_goal_full_s: 0.75
  demo_goal_window_s: 5.0
  demo_goal_last_defender: true    # PO : seulement la démo du dernier défenseur (toujours vrai en 1v1)…
  demo_goal_own_half: true         # … et dans son propre camp (en 1v1 : pas un attaquant démoli)
  high_goal_min_z: 600.0           # but sur une touche avec la balle à 600 uu ou plus (double saut : ~500)
  # 22/11 (paliers 19-20) : une seule touche payée par vol, selon ce qu'elle apporte (comme aerial_touch utile).
  wall_touch_min_z: 300.0          # wall_touch : 1re touche d'un vol parti d'un mur, balle à 300 uu ou plus
  fast_aerial_min_z: 500.0         # fast_aerial : 1re touche d'un vol avec double saut, balle à 500 uu ou plus…
  fast_aerial_fast_s: 0.8          # … plein dans les 0,8 s après le décollage, 0 à 2 s
  fast_aerial_slow_s: 2.0
  flight_touch_floor: 0.1        # jongler au mur sans rien apporter : 0,05 par vol (tests/test_exploits.py)
  weights:
    goal: 10.0
    strong_touch: 4.0              # |Δv balle| : 0 sous 20 km/h, plein à 100 km/h
    touch: 0.5                     # amorce : n'importe quelle touche (retirée au palier 2)
    vel_player_to_ball: 0.27
    face_ball: 0.017
    in_air: 0.017
    vel_ball_to_goal: 0.13
    boost_gain: 0.67
    boost_keep: 0.013
    demo: 5.3
    bump: 1.3
    # garde-fou (validation du 23/10 : sans lui, flips 25 → 2/min en 15 M, pente de la lignée s6) : paie tout de suite
    # un flip qui fait gagner de la vitesse vers la balle, boost déduit (s7e : flips 0,4 → 3,3/min en 30 M).
    # Seuil abaissé à 300 uu/s (flip_speed_min_speed) : au seuil de 1 000 de s7e, il ne payait rien avant 15 M, et
    # une fois les sauts réprimés, la séquence saut → relâcher → flip n'est plus jamais tirée au hasard
    flip_speed: 0.5
    double_commit: 0.0
curriculum:
  ema: 0.05
  patience: 20
  blend_steps: 100_000_000         # ~17 min sur le TPU (100 k steps/s) : 10 M y passait en 2 min
  stages:
    - name: bases                  # aller vite à la balle, la frapper fort, sauter / flipper sans crainte
      advance: {touches_per_min: 15, mech/flips_per_min: 3, mech/avg_speed: 1250}
      min_steps: 30_000_000
    - name: jeu                    # sans les aides d'amorce : marquer, défendre, gérer le boost
      rewards: {touch: 0.0, face_ball: 0.005, in_air: 0.008, vel_player_to_ball: 0.15, vel_ball_to_goal: 0.2,
                flip_speed: 0.3}
      advance: {ladder/gap/s6_spo_kaggle: 50}   # dernière version ≥ s6 + 50 Elo (≈ 57 % des points)
      min_steps: 40_000_000
    - name: avance                 # aériennes et kickoffs, seulement quand s6 est battu
      rewards: {aerial_touch: 1.0, kickoff_win: 1.0}
      ppo: {lr_actor: 1.0e-4, lr_critic: 1.0e-4}
      advance: {ladder/gap/s6_spo_kaggle: 150}  # 1re session TPU : +230 à 2,9 G steps → passage au palier 4
    # Palier 4 (25/10, après la 1re session TPU, 2,9 G steps) : en fin de palier 3, 62 % du signal payait « aller vite à
    # la balle et frapper fort » dans n'importe quelle direction (vel_player_to_ball 45 %, strong_touch 17 %), contre
    # 26 % pour le but (vel_ball_to_goal 17 %, goal 9 %) : 30 touches/min dont 6 % de tirs, kickoffs 0,1 % du signal,
    # « aériennes » payées dès 220 uu (de simples touches en sautant). Mêmes termes, autre dosage : viser le but.
    - name: precision
      rewards: {vel_player_to_ball: 0.06, strong_touch: 1.5, shot: 5.0, vel_ball_to_goal: 0.35, kickoff_win: 3.0,
                aerial_touch: 2.0, air_approach: 0.05}
      advance: {ladder/gap/s6_spo_kaggle: 150}  # 2e session TPU : +465 à 5,38 G steps → passage dès la reprise
    # Palier 5 (04/11, après les premiers matchs dans le vrai jeu) : 50 % des touches sur sa propre balle cadrée la
    # décadrent, 35 % de frappes cadrées, 0,1 vraie aérienne/min (REFONTE_S10 §9). On paie la balle cadrée et on reprend
    # la déviation (shot_threat), on rend le vol rentable, et on ne touche PAS à ce qui fait le jeu agressif de l'agent :
    # vel_player_to_ball, flip_speed, demo, bump et vel_ball_to_goal gardent leur poids, dépenser du boost reste gratuit.
    - name: finition
      rewards: {shot_threat: 3.0, strong_touch: 1.0, aerial_touch: 4.0, air_approach: 0.15, boost_gain: 1.0}
      ppo: {ent_coef: 0.005}       # une aérienne, c'est 1-2 s d'actions cohérentes : 24 actions tirées au hasard n'y arrivent pas
      advance: {ladder/gap/s6_spo_kaggle: 150}  # 3e session TPU : +528 à 8,14 G steps → passage dès la reprise
    # Palier 6 (06/11, après les matchs du PO, REFONTE_S10 §10) : garder ce qui marche, retirer ce qui paie encore les
    # sauts. `in_air` et `flip_speed` sont des aides du palier 1 ; `boost_gain` paie le ramassage sans compter la
    # dépense, et plus on est à sec plus il paie. Dépense au sol facturée comme Necto, vol gratuit. `flip_reset` à 5 : le
    # contact des roues compte comme un retour au sol, il ne paie pas `aerial_touch` (~4 pour une touche du nez à 1 000 uu).
    - name: maitrise
      rewards: {boost_spend: 0.5, in_air: 0.002, flip_speed: 0.1, kickoff_rush: 0.05, flip_reset: 5.0}
      # 0,003 en session 4 : entropie 2,65 → 2,1 en 750 M avant la faille, puis 1,13. Retour à la valeur du palier 5.
      ppo: {ent_coef: 0.005}
      # Session 6 : critère toujours rempli, on passe au palier 7 dès la reprise (20 itérations, ~8 M steps).
      advance: {goals_per_min: 0}
    # Palier 7 « lucidité » (11/11, décision PO). v13535 colle la balle et « commit » sur tout : contre Necto, il laisse
    # des tirs de loin. Le résultat du match ne faisait que ~17 % du signal (but ±10), les aides centrées sur soi le reste
    # (`vel_player_to_ball` paie l'approche même quand l'adversaire arrive avant). Inspiré de « goal / concede only » :
    # le but pèse double (±20, zéro-somme) et encaisser coûte en plus 5 (`concede`, hors zéro-somme) → marquer +20,
    # encaisser −25 : prendre un risque qui ne rapporte rien coûte. But + encaissement ≈ 33 % du signal au lieu de 17 %.
    # Un seul changement de jeu, pour qu'il reste attribuable. `aerial_touch` reste coupé (2 dérives en session 5,
    # v13535 progresse sans lui) : écrit ici en plus de guard.json.
    - name: lucidite
      rewards: {goal: 20.0, concede: 5.0, aerial_touch: 0.0}
      # Session 7 : palier 8 dès la reprise (20 itérations).
      advance: {goals_per_min: 0}
    # Paliers 8-10 (14/11, décision PO après les matchs contre Necto : 2 buts encaissés sur kickoff, peu de démos,
    # aériennes en attaque et en défense). Un changement par palier, pour qu'une dérive soit attribuable ; chaque
    # nouveau poids monte en 100-300 M steps (~15-45 min de TPU) ; on ne passe au suivant qu'après 500 M steps sans
    # régression (buts ≥ 2 / min, pas sous v13535 au classement). Le garde-fou plafonne chaque terme à 5 % du signal
    # et le ramène à son ancien poids s'il dérive. Tests : tests/test_exploits.py, tests/test_paliers_8_10.py.
    # Palier 8 : en simulation, Necto touche le premier dans ~90 % des kickoffs et marque sur 7 à 27 % d'entre eux.
    # kickoff_win (balle chez l'adversaire à 3 s, ±1, une fois par kickoff, antisymétrique) pesait 0,1 % du signal.
    # kickoff_rush (vitesse vers la balle jusqu'à la 1re touche, 4 s au plus) : 6 au plus par kickoff.
    # concede 5 → 2 (décision PO) : marquer +20, encaisser −25 rendait perdant tout duel à 50/50, kickoff compris ;
    # c'est à plein poids de lucidité que l'agent a cessé de les disputer. Transition en 100 M : l'évitement est
    # apparu en ~65 M steps à concede 5. On ne passe aux démos qu'une fois les kickoffs de nouveau disputés
    # (vs_hist/kickoff_win_rate tombé de 0,47 à 0,35 pendant l'effondrement).
    - name: kickoff
      rewards: {kickoff_win: 6.0, kickoff_rush: 0.1, concede: 2.0}
      blend_steps: 100_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0013535043833: 0, vs_hist/kickoff_win_rate: 0.5}
    # Palier 9 : la démo est payée depuis le palier 1 (5,3, zéro-somme) mais pèse 0,6 % du signal, ~0,1 / min. 8 = 40 %
    # d'un but (20) : une démo par minute rapporterait 8 / min, contre ~50 / min de buts à 2,5 buts / min.
    - name: demo
      rewards: {demo: 8.0}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0013535043833: 0}
    # Palier 10 : aerial_touch revient au quart de son poids d'avant (1 au lieu de 4), zéro-somme cette fois, avec ses
    # bornes du 08/11 (payé selon le gain vers le but adverse, une fois par vol ; dégager en l'air compte). Il est
    # aussi le dernier : s'il dérive, le garde-fou revient au jalon d'avant et le recoupe.
    - name: aerien
      rewards: {aerial_touch: 1.0}
      blend_steps: 300_000_000
      advance: {goals_per_min: 0}  # session 8 : palier 11 dès la reprise (20 itérations)
    # Paliers 11-14 (17/11, décision PO après 4 matchs contre Necto dans le vrai jeu, 2-2, 30-31) : bonne trajectoire,
    # mais il perd les duels aériens (Necto saute plus haut : dans la trace, 0 double saut sur 83 sauts et 312 uu au plus
    # pour v18160, 561 uu pour Necto), ne défend pas les tirs aériens, vise les gros boosts, gère mal bumps et défense.
    # Même méthode que les paliers 8-10 : un changement par palier, 200-300 M steps de transition, 500 M au moins par
    # palier, passage seulement sans régression (buts ≥ 2 / min, pas plus de 25 Elo sous v18160), plafond de 5 % du
    # signal par terme renforcé. En fin de session 7, aerial_touch pesait 0,02 % du signal et air_approach 0,3 %.
    # Palier 11 : aerial_touch 1 → 2 (zéro-somme : c'est un duel, ce que l'un gagne en l'air l'autre le perd). Une
    # parade en l'air est déjà payée comme une frappe (vitesse rendue vers le but adverse). Bornes du 08/11 inchangées.
    - name: duel_aerien
      rewards: {aerial_touch: 2.0}
      blend_steps: 300_000_000
      min_steps: 600_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0018160005774: -25}
    # Palier 12 : arrêts. `save` (vitesse retirée à une balle adverse qui file vers notre but, / 6 000) à 4 : un arrêt
    # d'une frappe à 3 000 uu/s vaut 2, 10 % d'un but. Zéro-somme : le tireur arrêté perd ce que gagne le gardien.
    - name: arrets
      rewards: {save: 4.0}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0018160005774: -25}
    # Palier 13 : bump 1,3 → 1,8 (zéro-somme : se faire bumper coûte autant). Il commence à marquer en bumpant le gardien.
    - name: bump
      rewards: {bump: 1.8}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0018160005774: -25}
    # Palier 14 (PO, 18/11 : il va sur les gros pads et ne comprend pas les petits ; le ramassage reste payé comme avant).
    # `boost_gain` (Δ√boost) paie un gros pad ~4 fois un petit : à 30 de boost, 0,45 contre 0,10. `small_pad` ajoute
    # 0,1 par petit pad (Δboost / 12, gains ≤ 13 seulement) : le petit pad pris sur le chemin vaut ~0,2, le gros ne change
    # pas. ~10 petits pads / min = 1 / min, 5 % d'un but ; rouler en boostant pour les reprendre coûte `boost_spend`.
    - name: petits_pads
      rewards: {small_pad: 0.1}
      blend_steps: 200_000_000
      # Session 9 : déjà 2,9 G steps à ce palier, il passe au palier 15 dès la reprise s'il tient face à v23037.
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0023037887394: -25}
    # Paliers 15-17 (20/11, décision PO après les BO3 dans le vrai jeu : v23037 bat Necto 2-0, v22650 2-0, v18160 2-1).
    # Même méthode que les paliers 8-14 : un changement par palier, 200 M steps de transition, 500 M au moins par palier,
    # passage seulement sans régression (buts ≥ 2 / min, pas plus de 25 Elo sous v23037), plafond de 3 % du signal par
    # nouveau terme. Aucune boucle : kickoff_stall est une pénalité versée une fois par kickoff ; demo_goal et high_goal
    # ne paient qu'au but, une fois par but (tests/test_exploits.py, tests/test_paliers_15_17.py).
    # Palier 15 : v22650 et v23037 ralentissent avant le kickoff pour arriver second, et quand les deux le font ils
    # s'arrêtent. Mesure du 20/11 (RocketSim, 300 kickoffs en auto-jeu) : balle touchée avant 3 s dans 8 % des kickoffs
    # pour v23037 (99 % pour v18160), 1re touche vers 4 s. Attendre ne coûtait rien : kickoff_win donne 0 aux deux
    # quand la balle reste au centre. Version du PO : pénalité croissante selon l'heure de la 1re touche, de 0 (kickoff
    # foncé + 0,1 s) à −2 une seconde plus tard (10 % d'un but), et −0,25 pour celui qui perd la course au ballon.
    - name: kickoff_dispute
      rewards: {kickoff_stall: 2.0}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0023037887394: -25}
    # Palier 16 : démolir le gardien, la balle sur le capot, et marquer (mécanique très utilisée à haut niveau). +4 (20 %
    # d'un but) à l'auteur de la démo si son équipe marque dans les 0,75 s, puis de moins en moins jusqu'à 0 à 3 s,
    # seulement si la victime était le dernier défenseur et dans son camp ; en plus de demo (8) et du but (20).
    # Zéro-somme. Mesure du 20/11 (auto-jeu, 4 998 buts) : 2,4 % des buts, aucune démo d'attaquant (à 5 s sans condition
    # de camp, 21 % des bonus en étaient) ; la démo du gardien (but en 0,6 s en médiane) reçoit 3,9 en moyenne.
    - name: demo_but
      rewards: {demo_goal: 4.0}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0023037887394: -25}
    # Palier 17 : marquer sur une aérienne haute ou un tir depuis le haut d'un mur. +5 (25 % d'un but) au buteur si sa
    # touche était la dernière, balle à 600 uu ou plus (au-dessus d'un double saut, sous la barre). Zéro-somme : encaisser
    # un but haut coûte autant, ce qui pousse aussi la défense aérienne. Environ 1 % des buts aujourd'hui (audits).
    - name: but_haut
      rewards: {high_goal: 5.0}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      # Session 10 : déjà 3,4 G steps à ce palier ; passe au palier 18 dès la reprise s'il tient face à v23037.
      advance: {goals_per_min: 2.0, ladder/gap/actor_0023037887394: 0}
    # Paliers 18-20 (22/11, PO après les BO3 : le bot ne bumpe jamais le gardien avant de marquer, n'est pas à l'aise au
    # mur, va moins vite en l'air que Necto et Nexto, qui doublent sauter). Même méthode : un changement par palier,
    # 200 M steps de transition, plafond de 3 % du signal, passage sans régression face à v23037.
    # Palier 18 : bump (sans démo) du dernier défenseur dans son camp, puis but : +3 plein jusqu'à 0,75 s, 0 à 5 s ;
    # la démo suivie d'un but reste à 4 (bonus cumulés sous un demi-but). Zéro-somme, ne paie qu'au but. 1 G steps au moins (PO : plus de temps).
    - name: bump_but
      rewards: {bump_goal: 3.0}
      blend_steps: 200_000_000
      min_steps: 1_000_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0023037887394: 0}
    # Palier 19 : 1re touche d'un vol parti d'un mur, balle à 300 uu ou plus, payée selon l'apport vers le but adverse
    # (0,25 à 1). Zéro-somme ; drill_wall passe à 10 % des départs pour toute la session.
    - name: murs
      rewards: {wall_touch: 0.5}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0023037887394: 0}
    # Palier 20 : 1re touche d'un vol avec double saut, balle à 500 uu ou plus, pleine si elle arrive dans les 0,8 s
    # après le décollage (0 à 2 s), selon l'apport vers le but adverse. Zéro-somme.
    - name: double_saut
      rewards: {fast_aerial: 1.0}
      blend_steps: 200_000_000
      # Session 12 : déjà 1,1 G steps à ce palier (29,05 → 30,16 G) ; passe au palier 21 dès la reprise.
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0030160068410: -25}
    # Paliers 21-25 (25/11, décision PO après la série du 24/11 et le diagnostic des kickoffs). Même méthode : un
    # changement par palier, 200 M steps de transition, 500 M au moins, passage sans régression face à v30160 (le bot
    # actuel, ancre), plafond de 3 % du signal pour chaque nouveau terme (retour à 0 s'il dérive).
    # Palier 21 : la 1re touche du kickoff. +2 (10 % d'un but), une fois par kickoff, à celui qui touche le premier sans
    # renvoyer la balle vers son but ; zéro-somme. v30160 : 0-4 % de 1res touches contre Necto et Nexto (sim et réel).
    - name: kickoff_gagne
      rewards: {kickoff_first: 2.0}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0030160068410: -25}
    # Palier 22 (PO : garder bumps et démos et les augmenter, il rate des buts tout faits) : demo 8 → 10, bump 1,8 → 2,5,
    # bump puis but 3 → 4,5 (avec high_goal, les bonus de but restent sous un demi-but). Tous zéro-somme.
    - name: contacts
      rewards: {demo: 10.0, bump: 2.5, bump_goal: 4.5}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0030160068410: -25}
    # Palier 23 (PO : boost moyen 31 contre 44 pour Nexto, sous 10 de boost 38 % du temps ; sans freiner la dépense) :
    # gros pad pris avec moins de 25 de boost, 0 à 1 selon le manque, une fois par 10 s au plus. 0,5 : 6 / min × 0,5 = 3
    # au plus par minute (15 % d'un but). La dépense n'est pas touchée (boost_spend inchangé, vol gratuit).
    - name: boost
      rewards: {big_pad_low: 0.5}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0030160068410: -25}
    # Palier 24 (tir cadré : 1,7 / min contre 2,8 pour Nexto, 0,87 but / min contre 1,31) : shot_threat 3 → 5, la balle
    # cadrée vers le but adverse vaut plus (potentiel : rien à accumuler).
    - name: tir_cadre
      rewards: {shot_threat: 5.0}
      blend_steps: 200_000_000
      min_steps: 500_000_000
      advance: {goals_per_min: 2.0, ladder/gap/actor_0030160068410: -25}
    # Palier 25 (PO : plus mobile, moins de longs demi-tours, et des dérapages) : slow_turn −0,3 par seconde au sol,
    # balle dans le dos à plus de 700 uu, à moins de 800 uu/s vers l'avant (un demi-tour lent de 1,5 s coûte ~0,45,
    # 2 % d'un but ; pénalité seule). powerslide 0,1 : un dérapage qui remet la balle de côté (90°) à face en gardant sa
    # vitesse vaut 0,05, de dos (180°) à face 0,1 ; signé, un toutes les 2 s au plus : la boucle « se détourner, revenir
    # en dérapant » rapporte au plus 30 × 0,1 = 3 par minute (15 % d'un but, cf. test). Les deux termes ensemble : un
    # seul changement de jeu (tourner vite).
    - name: mobilite
      rewards: {slow_turn: 0.3, powerslide: 0.1}
      blend_steps: 200_000_000
selfplay:
  hist_prob: 0.25
  # Sparring contre des bots externes (selfplay.sparring, algo/worker.py). Session 10 (22/11) : Nexto seul, 10 %.
  # Session 11 (23/11, décision PO) : quatre bots, chacun avec sa part des épisodes (`prob`) et son beta de départ
  # (1 = argmax comme en match, 0,5 = échantillonné, plus bas = plus faible). Le beta d'un bot monte de `promote_step`
  # dès que notre score moyen contre lui atteint `promote_score` sur ses `promote_window` derniers épisodes (gardé dans
  # le checkpoint). Ces parties ne comptent ni pour l'Elo ni pour le classement (vs_<bot>/*).
  # Betas de départ calibrés le 23/11 (v25785 échantillonné, 24 matchs par bot, part de nos buts) : nexto 0,5 → 19 % ;
  # galactus 0,5 → 8 %, 0,3 → 26 % ; kira 0,5 → 11 %, 0,3 → 38 % ; rain 0,5 → 54 % (en argmax, les trois GigaLearn nous
  # battent 24-0). On part donc là où l'on marque 20-50 % des buts, puis le beta monte de 0,1 à chaque palier franchi.
  # Parts : GalactusV2 (le plus fort, 1542 de MMR bot) et Kira en tête. Coût mesuré : un step contre un bot coûte
  # 4,8-7,4 ms au lieu de 1,8 ms (portable, 1 thread) → ~+30 % de temps de simulation pour 14 % des parties.
  sparring:
    promote_window: 300
    promote_score: 0.35
    promote_step: 0.1
    # Session 12 (PO, 25/11) : Nexto 4 % (beta repris du checkpoint, 0,9) ; les trois GigaLearn à 1 %, seuil de montée
    # 0,25 (bloqués à ~22 % de victoires sous 0,35 en session 11). Sparring 7 % au lieu de 14 % : moins de coût (−27 %
    # de débit en session 11) pour le self-play.
    bots:
      galactus: {prob: 0.01, beta_start: 0.3, promote_score: 0.25}
      kira: {prob: 0.01, beta_start: 0.3, promote_score: 0.25}
      nexto: {prob: 0.04, beta_start: 0.5}
      rain: {prob: 0.01, beta_start: 0.5, promote_score: 0.25}
  pool_every_steps: 5_000_000
  pool_recent: 20
  pfsp: true                       # (1 − p)² : les ancres déjà battues ne coûtent presque plus de parties
  ladder: true                     # selfplay/ladder.py
  ladder_fit_every: 20             # itérations entre deux calculs de l'échelle (coût en n², ~1 600 versions au départ)
  # s6 : repère de l'échelle. Les autres : styles différents et forts, le pool récent ne couvre que 100 M steps et les
  # résultats ne sont pas transitifs (v6800 bat v7000 24-6, 8,14 G bat v6800 20-8). v8100 = le bot actuel.
  # v8400 : point de départ de la session 5 (meilleure version mesurée, 59-1-0 et 41-6-13 contre v8100).
  # v13535 : point de départ de la session 6 et bot actuel (184-10-6 contre v8400) ; mesure l'effet du palier 7.
  # v13600 : point de départ de la session 7 ; v13720 : meilleure version de la session 6 au classement (156-15-29
  # contre v13535, mais 1-1-98 contre Necto en simulation). Les deux mesurent l'effet des paliers 8-10.
  # v18160 : meilleure version de la session 7 et bot actuel (2-2 contre Necto dans le vrai jeu) ; repère des paliers 11-14.
  # v23037 : fin de la session 8 et bot actuel (BO3 du 19-20/11 : 2-0 contre Necto, 2-0 contre v22650, 2-1 contre
  # v18160) ; repère des paliers 15-17. C'est le dernier checkpoint, pas une version du pool : nommé actor_0023037887394.
  # v25785 : meilleure version de la session 9 et bot actuel (BO3 du 21/11 : 2-0 contre Necto et v27450, 1-2 contre
  # v23037) ; repère des paliers 18-20.
  anchors: [runs/s6_spo_kaggle, pool/actor_0005315235148.pt, pool/actor_0006800183709.pt, pool/actor_0007000329112.pt,
            pool/actor_0007565061406.pt, pool/actor_0008100114172.pt, pool/actor_0008400059217.pt,
            pool/actor_0013535043833.pt, pool/actor_0013600266923.pt, pool/actor_0013720292116.pt,
            pool/actor_0018160005774.pt, checkpoints/ckpt_0023037887394.pt, pool/actor_0025785348226.pt, pool/actor_0030160068410.pt]
  anchor_prob: 0.5                 # 12,5 % des épisodes
